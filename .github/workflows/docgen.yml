name: Documentation drift

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  check:
    name: Check documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12.4.1
          runtime: node@22
          cache: true

      - name: Build docgen
        run: pnpm build

      - name: Check documentation drift
        id: docgen
        continue-on-error: true
        env:
          DOCGEN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run:
          node ./dist/cli.js check --since "$DOCGEN_BASE_SHA" --sarif >
          docgen.sarif

      - name: Upload SARIF
        if: always() && hashFiles('docgen.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: docgen.sarif

      - name: Propagate docgen result
        if: steps.docgen.outcome == 'failure'
        run: exit 1

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12.4.1
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Verify tag matches package version
        run:
          node -e "if ('v' + require('./package.json').version !==
          process.env.GITHUB_REF_NAME) process.exit(1)"

      - name: Verify release
        run: pnpm build && pnpm test && pnpm typecheck && pnpm lint

      - name: Publish to npm
        run: npm publish --access public --provenance
